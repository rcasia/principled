# The gates that protect main. Everything here runs on every push and every
# pull request, and nothing is allowed to land red. Mutation testing reports
# separately (mutation.yml, ADR-0038) and never blocks delivery.
name: gates

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - run: bun install --frozen-lockfile
      # Pull requests: validate the range. Pushes: validate the head commit.
      - name: Lint commit messages
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            bunx commitlint --from "${{ github.event.pull_request.base.sha }}" --to HEAD --verbose
          else
            bunx commitlint --last --verbose
          fi

  test:
    name: typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - run: bun install --frozen-lockfile
      # Backstops the pre-commit hook (lefthook.yml) for commits made with
      # --no-verify and for pull requests from forks, where local hooks never
      # ran at all.
      - run: bun run audit

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pinned to the version that generated .secrets.baseline, so local
      # hooks and CI evaluate the same plugin set.
      - run: pip install detect-secrets==1.5.0
      # Backstops the pre-commit hook (lefthook.yml) for commits made with
      # --no-verify and for pull requests from forks, where local hooks never
      # ran at all. Scans every tracked file against the baseline, so only
      # secrets added after the baseline fail the gate.
      - run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

  lambda-bundle:
    name: lambda bundle runs on node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      # The handler zip embeds the client bundles (ADR-0029), so the client
      # build runs first — the same order as the infra:plan/apply scripts.
      - run: bun run build:client
      - run: bun run build:lambda
      # Production runs Node while development runs Bun (ADR-0005). This keeps
      # that gap honest by invoking the real bundle the way Lambda would.
      - name: Smoke test the bundle
        run: node scripts/smoke-lambda.mjs

  cli-package:
    name: cli package installs from npm tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - run: bun run build:cli
      # Packs the tarball npm would publish, installs it in a clean directory
      # with Node and runs the binary. Proves the package works for someone
      # without Bun, and that `files` ships nothing it should not.
      - run: bun scripts/check-cli-package.ts

  infra:
    name: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.13.3"
      - run: bun install --frozen-lockfile
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate
      # LocalStack means the plan needs no AWS credentials, so this gate works
      # on a public repository with no secrets at all.
      - name: Start LocalStack
        run: bun run localstack:up
      - name: Apply against LocalStack
        run: bun run infra:apply:local
      - name: Check the deployed function serves the page
        run: bun scripts/check-deployed.ts
      - name: LocalStack logs
        if: failure()
        run: docker logs localstack --tail 200
      - name: Destroy
        if: always()
        run: bun run infra:destroy:local
