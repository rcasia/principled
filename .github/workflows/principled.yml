# Run Principled on pull requests and attach findings to the change (#41).
#
# - Analysis is local: no account, no network, no telemetry. The only
#   network call in this workflow is the SARIF upload to GitHub.
# - Minimal permissions: `contents: read` to check out, `security-events:
#   write` to upload findings. Nothing here can push code or read secrets.
# - Results attach to the pull request via code scanning, one alert per
#   finding, associated with the analyzed commit. Principled reports code
#   findings only, never individual developer rankings.
# - Violations do not fail the job: they are recorded as code-scanning
#   alerts for review. An execution failure (exit 2: the tool itself broke)
#   does fail, because then no findings can be trusted.
name: principled

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze changed files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - run: bun install --frozen-lockfile
      - name: Analyze changed sources to SARIF
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="origin/main"
          fi
          mkdir -p sarif
          git diff --name-only --diff-filter=AM "$base"...HEAD -- '*.ts' '*.js' | grep -v '\.test\.' > changed.txt || true
          if [ ! -s changed.txt ]; then
            echo "No analyzable files changed."
            exit 0
          fi
          # No pipeline: `exit 2` below must fail the step, not a subshell.
          while IFS= read -r file; do
            safe=$(printf '%s' "$file" | tr '/' '_')
            bun packages/cli/src/bin.ts analyze "$file" --format sarif > "sarif/$safe.sarif"
            code=$?
            if [ "$code" -eq 2 ]; then
              echo "ERROR: could not analyze $file"
              exit 2
            fi
            echo "analyzed $file (exit $code)"
          done < changed.txt
      - name: Combine findings
        if: hashFiles('sarif/*.sarif') != ''
        run: |
          jq -s '
            .[0] as $first |
            {
              "$schema": $first["$schema"],
              version: $first.version,
              runs: [
                ($first.runs[0] + {
                  results: (map(.runs[].results) | add)
                })
              ]
            }
          ' sarif/*.sarif > combined.sarif
      - name: Upload findings to code scanning
        if: hashFiles('combined.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          # sarif_file is the supported input; path is ignored by CodeQL.
          sarif_file: combined.sarif
