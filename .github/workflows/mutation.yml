# Mutation testing, standalone and advisory. Split out of `gates.yml`
# (ADR-0038): the score is reported but never holds up delivery — the trunk
# stays protected by typecheck, tests, review and the deployment gates.
# Push runs test only the files changed by the push (ADR-0046), so
# agent-sized diffs finish in minutes instead of ~1.5h; a weekly full run
# keeps the global score honest. Pull requests are intentionally not
# triggered until the score is a gate again.
name: mutation

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly full run: the global score, including drift that diff-scoped
    # push runs intentionally skip (dependency updates, config edits), is
    # re-verified here. Mondays 02:00 UTC; audit runs 06:00, no conflict.
    - cron: "0 2 * * 1"

permissions:
  contents: read

concurrency:
  # Queue, never cancel: a new push waits behind the running mutation run
  # instead of superseding it, so every main commit eventually gets its
  # score without two runs overlapping. Push runs now finish in
  # seconds–minutes (ADR-0046), so the queue drains instead of piling up
  # hour-long runs.
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    name: mutation score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: push runs diff the push base against HEAD.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      # Stryker runs on Node even though the tests it drives run on Bun.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      # Scope: the schedule (and manual dispatch, an explicit opt-in to the
      # global signal) runs everything. Pushes test only changed sources,
      # with changed tests mapped to the source they cover (the repo keeps
      # tests colocated as foo.test.ts next to foo.ts). No --incremental
      # anywhere in CI: at this suite size Stryker 10 crashes serializing
      # the full incremental report (RangeError), and fresh subset reports
      # are small. Local opt-in via `bun run test:mutation:incremental`
      # is untouched.
      - name: Run mutation testing
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Full mutation run (scheduled or manual)."
            bun run test:mutation
            exit 0
          fi
          base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="HEAD~1"
          fi
          if ! changed=$(git diff --name-only "$base" HEAD -- 'packages/*/src/**/*.ts' 'packages/*/src/**/*.tsx'); then
            echo "Could not diff against base; running full mutation to stay sound."
            bun run test:mutation
            exit 0
          fi
          files=""
          for f in $changed; do
            case "$f" in
              *.test.ts) src="${f%.test.ts}.ts" ;;
              *.test.tsx) src="${f%.test.tsx}.tsx" ;;
              *.ts|*.tsx) src="$f" ;;
              *) continue ;;
            esac
            case "$(basename "$src")" in
              index.ts|bin.ts|lambda-entry.ts) continue ;;
            esac
            if [ -f "$src" ]; then
              files="$files $src"
            fi
          done
          mutate=$(echo "$files" | tr ' ' '\n' | sort -u | grep -v '^$' | paste -sd, - || true)
          if [ -z "$mutate" ]; then
            echo "No source or test changes in this push; skipping mutation (weekly full covers the global score)."
            exit 0
          fi
          echo "Testing mutants in: $mutate"
          bunx stryker run --mutate "$mutate"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation
          retention-days: 7
