# Trunk based delivery. Every push to main runs the same gates a pull request
# runs; if they pass, the commit is released and promoted to production.
name: main

on:
  push:
    branches: [main]

permissions:
  contents: read

# Never release or deploy two commits at once, and never cancel one halfway:
# the newest commit that passes the gates wins, in order.
concurrency:
  group: main-delivery
  cancel-in-progress: false

jobs:
  gates:
    uses: ./.github/workflows/gates.yml

  # Two independent release trains, run in parallel: each only releases the
  # commits that touched its own files or core, so neither waits on the
  # other. Both push a release commit and tag with @semantic-release/git,
  # so on runs where both cut a release the two pushes race - each Release
  # step below retries with a re-sync for exactly that case.
  # See ADR-0016 for why the trains are split, ADR-0019 for why routing is
  # by changed files, ADR-0020 for why parallel is safe, and
  # scripts/scoped-release-plugins.mjs for how each train only sees the
  # commits that touched its own files or core.
  release-cli:
    name: release the cli
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # npm provenance when publishing is switched on.
    steps:
      # `ref: main`: check out the branch's current tip, not the run's
      # triggering SHA, so a direct push that landed while the gates ran
      # doesn't start this job from a stale HEAD. Same as release-web.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      # semantic-release refuses to run on Bun's reported version, so it is
      # invoked through the Node installed above rather than through bunx.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # Node 22 bundles npm ~10.9.x. OIDC trusted publishing needs npm
      # >= 11.5.1 (docs.npmjs.com/trusted-publishers), so it is upgraded
      # explicitly rather than trusting whatever setup-node shipped.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@^11.5.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The release commit made by @semantic-release/git below runs the
      # repo's pre-commit hooks, including the detect-secrets staged scan
      # (ADR-0027). Without this the hook fails with exit 127 and the
      # release retries until the job fails. Pinned to the baseline version.
      - run: pip install detect-secrets==1.5.0
      - run: bun install --frozen-lockfile
      - name: Release
        run: |
          # The sibling train may push its own release commit first; if this
          # train's push is then rejected (non-fast-forward), re-sync and
          # retry. The sibling's release commit touches only its own files,
          # so this train's filter excludes it and the retry re-analyzes
          # cleanly from the new tip. The workflow-level main-delivery
          # concurrency group serializes runs, so the sibling is the only
          # concurrent pusher - one retry always suffices, three attempts
          # bound it.
          for attempt in 1 2 3; do
            if ./node_modules/.bin/semantic-release --extends ./release.cli.config.mjs; then
              exit 0
            fi
            echo "Release attempt $attempt failed; re-syncing with main and retrying..."
            git fetch origin main
            git reset --hard origin/main
          done
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Publishing the CLI to npm is off until NPM_PUBLISH is "true".
          # The version is bumped and the tarball is built and verified
          # either way, so the path stays exercised. Publishing prefers OIDC
          # trusted publishing (id-token: write, above); NPM_TOKEN is only a
          # fallback for the one-time bootstrap publish, before a trusted
          # publisher can be registered for this repository. See ADR-0010.
          NPM_PUBLISH: ${{ vars.NPM_PUBLISH }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  release-web:
    name: release the web app
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # `ref: main` fetches the branch's current tip rather than the run's
      # original triggering SHA, so a direct push that landed while the
      # gates ran doesn't leave this job releasing from a stale HEAD
      # (semantic-release refuses with "local branch is behind the remote
      # one"). The retry below covers whatever moved after checkout.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Same reason as release-cli above: the @semantic-release/git commit
      # runs the pre-commit hooks, which need detect-secrets on PATH.
      - run: pip install detect-secrets==1.5.0
      - run: bun install --frozen-lockfile
      - name: Release
        run: |
          # Same push race as release-cli, mirrored: the sibling train may
          # win the push to main first. Re-sync and retry; the sibling's
          # release commit is filtered out of this train, so the retry
          # re-analyzes cleanly. See the comment on release-cli's step.
          for attempt in 1 2 3; do
            if ./node_modules/.bin/semantic-release --extends ./release.web.config.mjs; then
              exit 0
            fi
            echo "Release attempt $attempt failed; re-syncing with main and retrying..."
            git fetch origin main
            git reset --hard origin/main
          done
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: promote to production
    needs: [release-cli, release-web]
    # Inert until infra/bootstrap has been applied and AWS_DEPLOY_ROLE_ARN is
    # set, so the pipeline is green on a fork or before an AWS account exists.
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC only. No long lived AWS keys in this repository.
    steps:
      # `ref: main`: same reason as release-web's checkout - two release
      # jobs may already have pushed to main by the time this job starts,
      # and this should build and deploy what is actually on main now, not
      # the SHA that originally triggered the run.
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.13.3"
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}
      - run: bun install --frozen-lockfile
      # The handler zip embeds the client bundles (ADR-0029), so the client
      # builds first — the same order as the gates and release scripts.
      - run: bun run build:client
      - run: bun run build:lambda
      # The edge signer zip must exist before apply: the us-east-1 function
      # reads it via filebase64sha256 (ADR-0019).
      - run: bun run build:edge-signer
      # Remote state, so each run sees what the previous one created.
      # Provisioned once by infra/bootstrap - see its README.
      - name: Init with remote state
        run: |
          terraform -chdir=infra init -input=false \
            -backend-config=backend.prod.hcl \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ vars.AWS_REGION || 'eu-west-1' }}"
      - run: |
          # ADR-0041: the custom domain stays off (var default null) unless the
          # CUSTOM_DOMAIN repository variable names it. The zone must already
          # exist - registering through Route53 creates it; see infra/README.
          extra=""
          if [ -n "${{ vars.CUSTOM_DOMAIN }}" ]; then extra="-var custom_domain=${{ vars.CUSTOM_DOMAIN }}"; fi
          terraform -chdir=infra apply -auto-approve -input=false -var environment=prod $extra
        env:
          TF_VAR_legal_operator_name: ${{ vars.LEGAL_OPERATOR_NAME }}
          TF_VAR_legal_operator_address: ${{ vars.LEGAL_OPERATOR_ADDRESS }}
          TF_VAR_legal_privacy_email: ${{ vars.LEGAL_PRIVACY_EMAIL }}
          TF_VAR_legal_security_email: ${{ vars.LEGAL_SECURITY_EMAIL }}
      - name: Check production serves the page
        run: bun scripts/check-deployed.ts
