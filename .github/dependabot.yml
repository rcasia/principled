# Dependabot keeps the three ecosystems in this repo current: Bun
# (workspace lockfile), Terraform, and GitHub Actions. Commit prefixes use
# scopes from the scope-enum in commitlint.config.mjs so the gates job stays
# green on dependency PRs.
#
# Group names stay short on purpose: Dependabot builds the PR title as
# "bump the <group> group across …", and commitlint's subject-max-length
# (72) counts the subject. Long group names like bun-minor-and-patch
# pushed merged titles (with the " (#PR)" suffix) over the limit and turned
# main red. Single-word groups keep both the PR and the merged title green.

version: 2
updates:
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 10
    # ADR-0003 pins TypeScript to 5.x: v7 (Go rewrite) no longer exposes
    # the compiler API Stryker's tsconfig preprocessing calls.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      bun:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        update-types:
          - minor
          - patch

  - package-ecosystem: terraform
    directories:
      - /infra
      - /infra/bootstrap
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(infra)
    groups:
      terraform:
        update-types:
          - minor
          - patch
